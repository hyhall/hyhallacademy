<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Hyhall Academy</title>
  <link rel="icon" href="img/marca/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/marca/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/marca/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2437;
      --muted: #6b7189;
      --border: #dfe3ee;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --error: #dc2626;
      --success: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1220;
        --card: #181c30;
        --text: #eef0fa;
        --muted: #9aa1bd;
        --border: #2b3150;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(79,70,229,.15), transparent 50%), var(--bg);
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(20, 24, 60, .12);
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .lead { margin: 0 0 28px; color: var(--muted); }
    .field { position: relative; margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: .88rem; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea { min-height: 130px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,.18);
    }
    .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--error); }
    .error { display: none; margin-top: 4px; font-size: .8rem; color: var(--error); }
    .field.invalid .error { display: block; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: .85rem; color: var(--muted); margin-bottom: 22px; }
    .check input { width: auto; margin-top: 3px; accent-color: var(--primary); }
    button {
      width: 100%;
      padding: 14px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.98); }
    .status { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: .9rem; color: var(--success); background: rgba(22,163,74,.12); }
    .status.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Contáctanos</h1>
    <p class="lead">¿Tienes dudas sobre nuestros cursos? Escríbenos y te responderemos en menos de 24 horas.</p>

    <form id="contact-form" novalidate>
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="name" required>
        <span class="error">Por favor, escribe tu nombre.</span>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
        <span class="error">Introduce un correo válido.</span>
      </div>

      <div class="field">
        <label for="asunto">Asunto</label>
        <select id="asunto" name="asunto" required>
          <option value="">Selecciona una opción</option>
          <option>Información sobre cursos</option>
          <option>Matrícula y precios</option>
          <option>Soporte técnico</option>
          <option>Otro</option>
        </select>
        <span class="error">Elige un asunto.</span>
      </div>

      <div class="field">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="¿En qué podemos ayudarte?" minlength="10" required></textarea>
        <span class="error">El mensaje debe tener al menos 10 caracteres.</span>
      </div>

      <label class="check">
        <input type="checkbox" id="privacidad" required>
        <span>Acepto la política de privacidad y el tratamiento de mis datos.</span>
      </label>

      <button type="submit">Enviar mensaje</button>
      <div class="status" id="status" role="status">¡Gracias! Hemos recibido tu mensaje.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      form.querySelectorAll('.field').forEach((field) => {
        const input = field.querySelector('input, select, textarea');
        const ok = input.checkValidity();
        field.classList.toggle('invalid', !ok);
        if (!ok) valid = false;
      });
      if (!document.getElementById('privacidad').checked) valid = false;
      if (!valid) { status.classList.remove('show'); return; }

      // TODO: conectar con el backend / servicio de formularios.
      status.classList.add('show');
      form.reset();
    });
  </script>
</body>
</html>
